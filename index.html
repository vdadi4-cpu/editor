<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Editor</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#171a24"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#171a24;--pn:#222736;--pn2:#2d3447;--tx:#eceef5;--mu:#8b93a8;--ac:#ffcf4a;--ink:#1a1500;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef0f6;--pn:#fff;--pn2:#e0e4ef;--tx:#1b2030;--mu:#5c657c;color-scheme:light}}
:root[data-theme="dark"]{--bg:#171a24;--pn:#222736;--pn2:#2d3447;--tx:#eceef5;--mu:#8b93a8}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden;touch-action:manipulation}
button{font:inherit;color:inherit;background:var(--pn2);border:0;border-radius:10px;padding:8px 11px;min-height:36px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac)}
.ac{background:var(--ac);color:var(--ink);font-weight:700}
.mu{color:var(--mu);margin:6px 0}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px}
h1{font-size:20px;margin:0;letter-spacing:-.02em;font-weight:800}
#stage{flex:1;min-height:0;position:relative;padding:0 12px}
#cv{width:100%;height:100%;object-fit:contain;touch-action:none;background:#000;border-radius:8px}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.row{display:flex;gap:8px;align-items:center;padding:6px 12px}
#tm{flex:1;text-align:center;font-variant-numeric:tabular-nums;color:var(--mu)}
#tl{position:relative;overflow-x:auto;overflow-y:hidden;height:112px;background:var(--pn)}
#in{position:relative;height:100%}
#rl{position:absolute;left:0;right:0;top:0;height:24px;touch-action:none;background-image:linear-gradient(90deg,var(--mu) 1px,transparent 1px);background-repeat:repeat-x;color:var(--mu);font-size:10px}
#rl span{position:absolute;top:10px;transform:translateX(3px)}
#cr{position:absolute;top:28px;left:20px;display:flex;height:48px}
.cl{box-sizing:border-box;height:48px;border:2px solid transparent;border-radius:7px;background:linear-gradient(135deg,#4a6fa5,#6a5acd);overflow:hidden;padding:4px 6px;font-size:11px;color:#fff;flex:none;display:flex;flex-direction:column}
.cl span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cl b{font-weight:400;opacity:.8}
.cl.on{border-color:var(--ac)}
#xr{position:absolute;top:82px;left:0;height:24px;width:100%}
.tx{position:absolute;height:22px;box-sizing:border-box;border:2px solid transparent;border-radius:6px;background:#2a9d8f;color:#fff;font-size:11px;padding:1px 5px;overflow:hidden;white-space:nowrap}
.tx.on{border-color:var(--ac)}
#ph{position:absolute;top:0;bottom:0;left:0;width:2px;background:var(--ac);pointer-events:none;z-index:2}
#acts{display:flex;gap:6px;padding:8px 12px;overflow-x:auto}
#acts button{flex:none}
#tabs{display:flex;gap:4px;padding:0 12px;overflow-x:auto}
#tabs button{flex:none;background:transparent;color:var(--mu);border-radius:8px 8px 0 0}
#tabs button.on{background:var(--pn);color:var(--tx);font-weight:700}
#pn{background:var(--pn);padding:8px 12px 10px;height:132px;overflow-y:auto;box-sizing:border-box}
.rw{display:flex;align-items:center;gap:10px;margin:4px 0}
.rw span{width:62px;color:var(--mu)}.rw input[type=range]{flex:1;accent-color:var(--ac)}.rw output{width:54px;text-align:right;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.chips button.on{background:var(--ac);color:var(--ink)}
input[type=text]{flex:1;min-width:0;background:var(--pn2);color:var(--tx);border:0;border-radius:8px;padding:8px;font:inherit}
input[type=color]{border:0;width:38px;height:34px;background:none;padding:0}
#mo{position:fixed;inset:0;background:rgba(10,12,18,.8);display:flex;align-items:center;justify-content:center;z-index:9}
#mo[hidden]{display:none}
#mb{background:var(--pn);border-radius:14px;padding:16px;width:min(340px,88vw);text-align:center}
#mb video{width:100%;max-height:50vh;border-radius:8px;background:#000}
#mb .row{justify-content:center}
#ts{position:fixed;left:50%;top:60px;transform:translateX(-50%);background:var(--ac);color:var(--ink);padding:8px 14px;border-radius:20px;font-weight:600;z-index:10;display:none}
</style></head><body>
<header><h1>Editor</h1><div style="display:flex;gap:6px"><button id="un">Undo</button><button class="ac" id="ex">Export</button></div></header>
<div id="stage"><canvas id="cv"></canvas>
<div id="empty"><div style="font-size:18px;font-weight:700">Start a new project</div><div class="mu">Pick one or more videos from your device.</div><button class="ac" id="ad0">Add videos</button></div></div>
<div class="row"><button id="pl" class="ac" style="min-width:74px">Play</button><div id="tm">00:00.0 / 00:00.0</div><button id="zo">−</button><button id="zi">+</button></div>
<div id="tl"><div id="in"><div id="rl"></div><div id="cr"></div><div id="xr"></div><div id="ph"></div></div></div>
<div id="acts"><button id="ad">Add video</button><button id="sp">Split</button><button id="du">Duplicate</button><button id="de">Delete</button></div>
<div id="tabs"></div><div id="pn"></div>
<input type="file" id="fi" accept="video/*" multiple hidden>
<div id="mo" hidden><div id="mb"></div></div><div id="ts"></div>
<script>
const $=s=>document.querySelector(s),cv=$('#cv'),cx=cv.getContext('2d'),PAD=20;
let clips=[],texts=[],t=0,playing=false,pi=0,sel=0,selT=-1,tab='trim',PPS=50,ratio='9:16',fit='fit',hist=[],exporting=false,rec,ac,gain,dest,drag=0;
const R={'9:16':[540,960],'16:9':[960,540],'1:1':[720,720],'4:5':[576,720]};
const PRE={None:[100,100,100,''],Vivid:[105,115,140,''],Mono:[100,110,0,''],Warm:[105,100,110,'sepia(.35)'],Cool:[100,105,90,'hue-rotate(-20deg)'],Fade:[112,85,80,''],Noir:[85,150,0,'']};
const v=document.createElement('video');v.playsInline=true;v.preload='auto';v.style.cssText='position:fixed;width:1px;height:1px;opacity:0;pointer-events:none';document.body.appendChild(v);
const len=c=>(c.out-c.in)/c.sp,total=()=>clips.reduce((a,c)=>a+len(c),0),off=i=>clips.slice(0,i).reduce((a,c)=>a+len(c),0);
const fmt=s=>{s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,'0')+':'+(s%60).toFixed(1).padStart(4,'0')};
const toast=m=>{const e=$('#ts');e.textContent=m;e.style.display='block';clearTimeout(toast.k);toast.k=setTimeout(()=>e.style.display='none',2200)};
function at(tm){let a=0;for(let i=0;i<clips.length;i++){const l=len(clips[i]);if(tm<a+l||i==clips.length-1)return{i,l:Math.min(Math.max(tm-a,0),l)};a+=l}return{i:0,l:0}}
function audio(){if(ac)return ac.resume();ac=new AudioContext();const s=ac.createMediaElementSource(v);gain=ac.createGain();dest=ac.createMediaStreamDestination();s.connect(gain);gain.connect(ac.destination);gain.connect(dest)}
function load(i,l,go){const c=clips[i];if(!c)return;pi=i;const ap=()=>{v.currentTime=c.in+l*c.sp;v.playbackRate=c.sp;if(gain)gain.gain.value=c.vol;go?v.play().catch(()=>{}):v.pause()};
if(v.dataset.u!==c.url){v.dataset.u=c.url;v.src=c.url;v.onloadedmetadata=ap}else ap()}
function seek(tm){t=Math.min(Math.max(tm,0),total());if(!clips.length)return;const p=at(t);load(p.i,p.l,playing)}
function play(){if(!clips.length)return;audio();if(t>=total()-.05)t=0;playing=true;const p=at(t);load(p.i,p.l,true);ui()}
function pause(){playing=false;v.pause();ui();if(exporting)fin()}
function tick(){if(playing&&v.readyState>=1){const c=clips[pi];if(c){if(v.currentTime>=c.out-.04||v.ended){if(pi<clips.length-1)load(pi+1,0,true);else{t=total();pause()}}else if(v.dataset.u===c.url&&!v.seeking){t=off(pi)+Math.max(0,(v.currentTime-c.in)/c.sp)}}}
draw();head();requestAnimationFrame(tick)}
const NF=(()=>{const k=document.createElement('canvas').getContext('2d');k.filter='blur(1px)';return k.filter!=='blur(1px)'})();
let GL,gp,gu;
function glDraw(f,W,H,w,h){if(!GL){const c=document.createElement('canvas');GL=c.getContext('webgl',{preserveDrawingBuffer:true});const g=GL,sh=(t,x)=>{const o=g.createShader(t);g.shaderSource(o,x);g.compileShader(o);return o};gp=g.createProgram();
g.attachShader(gp,sh(g.VERTEX_SHADER,'attribute vec2 p;uniform vec2 sc;varying vec2 u;void main(){u=vec2(p.x*.5+.5,.5-p.y*.5);gl_Position=vec4(p*sc,0,1);}'));
g.attachShader(gp,sh(g.FRAGMENT_SHADER,'precision mediump float;varying vec2 u;uniform sampler2D T;uniform vec4 a;uniform vec3 tn;void main(){vec3 c=texture2D(T,u).rgb*a.x*tn;c=(c-.5)*a.y+.5;float l=dot(c,vec3(.299,.587,.114));c=mix(vec3(l),c,a.z);gl_FragColor=vec4(clamp(c,0.,1.),1.);}'));
g.linkProgram(gp);g.useProgram(gp);const b=g.createBuffer();g.bindBuffer(g.ARRAY_BUFFER,b);g.bufferData(g.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),g.STATIC_DRAW);const l=g.getAttribLocation(gp,'p');g.enableVertexAttribArray(l);g.vertexAttribPointer(l,2,g.FLOAT,false,0,0);
g.bindTexture(g.TEXTURE_2D,g.createTexture());g.pixelStorei(g.UNPACK_FLIP_Y_WEBGL,false);[[g.TEXTURE_WRAP_S,g.CLAMP_TO_EDGE],[g.TEXTURE_WRAP_T,g.CLAMP_TO_EDGE],[g.TEXTURE_MIN_FILTER,g.LINEAR],[g.TEXTURE_MAG_FILTER,g.LINEAR]].forEach(([k,x])=>g.texParameteri(g.TEXTURE_2D,k,x));
gu={sc:g.getUniformLocation(gp,'sc'),a:g.getUniformLocation(gp,'a'),tn:g.getUniformLocation(gp,'tn')}}
const g=GL,c=g.canvas;if(c.width!==W||c.height!==H){c.width=W;c.height=H}g.viewport(0,0,W,H);g.clearColor(0,0,0,1);g.clear(g.COLOR_BUFFER_BIT);
const tn=f.x.includes('sepia')?[1.1,1,.85]:f.x.includes('hue')?[.9,1,1.1]:[1,1,1];
g.uniform2f(gu.sc,w/W,h/H);g.uniform4f(gu.a,f.b/100,f.c/100,f.s/100,1);g.uniform3f(gu.tn,tn[0],tn[1],tn[2]);
try{g.texImage2D(g.TEXTURE_2D,0,g.RGB,g.RGB,g.UNSIGNED_BYTE,v)}catch(_){return}g.drawArrays(g.TRIANGLE_STRIP,0,4);cx.drawImage(c,0,0)}
async function saveNative(b,name){const P=window.Capacitor&&window.Capacitor.Plugins;if(!P||!P.Filesystem||!P.Share)return false;
const d=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result.split(',')[1]);fr.readAsDataURL(b)});
const w=await P.Filesystem.writeFile({path:name,data:d,directory:'CACHE'});await P.Share.share({title:'Editor export',url:w.uri});return true}
function draw(){const[W,H]=R[ratio];if(cv.width!==W){cv.width=W;cv.height=H}cx.fillStyle='#000';cx.fillRect(0,0,W,H);
if(clips.length&&v.videoWidth){const f=clips[at(t).i].f,s=(fit=='fit'?Math.min:Math.max)(W/v.videoWidth,H/v.videoHeight),w=v.videoWidth*s,h=v.videoHeight*s;
if(NF)glDraw(f,W,H,w,h);else{cx.filter=`brightness(${f.b}%) contrast(${f.c}%) saturate(${f.s}%) ${f.x}`;cx.drawImage(v,(W-w)/2,(H-h)/2,w,h);cx.filter='none'}}
texts.forEach((x,i)=>{if(t<x.s||t>x.e)return;const z=x.z*W/540;cx.font=`800 ${z}px system-ui,sans-serif`;cx.textAlign='center';cx.textBaseline='middle';cx.lineJoin='round';cx.lineWidth=z/6;cx.strokeStyle='rgba(0,0,0,.7)';cx.strokeText(x.txt,x.x*W,x.y*H);cx.fillStyle=x.c;cx.fillText(x.txt,x.x*W,x.y*H);
if(i==selT&&!exporting){const w=cx.measureText(x.txt).width;cx.setLineDash([8,6]);cx.lineWidth=3;cx.strokeStyle='#ffcf4a';cx.strokeRect(x.x*W-w/2-8,x.y*H-z/2-6,w+16,z+12);cx.setLineDash([])}})}
function head(){const x=PAD+t*PPS;$('#ph').style.transform=`translateX(${x}px)`;$('#tm').textContent=fmt(t)+' / '+fmt(total());
if(playing)$('#tl').scrollLeft=x-$('#tl').clientWidth/2;if(exporting){const p=$('#pc');if(p)p.textContent=Math.round(100*t/Math.max(total(),.1))+'%'}}
function renderTL(){const tot=total();$('#in').style.width=(PAD+tot*PPS+innerWidth*.6)+'px';const r=$('#rl');r.style.backgroundSize=PPS+'px 8px';r.style.backgroundPositionX=PAD+'px';
const st=Math.max(1,Math.round(80/PPS));let h='';for(let s=0;s<=tot+1;s+=st)h+=`<span style="left:${PAD+s*PPS}px">${s}s</span>`;r.innerHTML=h;
$('#cr').innerHTML=clips.map((c,i)=>`<div class="cl ${i==sel?'on':''}" data-i="${i}" style="width:${len(c)*PPS}px"><span>${c.name}</span><b>${len(c).toFixed(1)}s${c.sp!=1?' · '+c.sp+'x':''}</b></div>`).join('');
$('#xr').innerHTML=texts.map((x,i)=>`<div class="tx ${i==selT?'on':''}" data-i="${i}" style="left:${PAD+x.s*PPS}px;width:${Math.max(24,(x.e-x.s)*PPS)}px">${x.txt}</div>`).join('')}
function ui(){$('#pl').textContent=playing?'Pause':'Play';$('#empty').style.display=clips.length?'none':'flex';
$('#tabs').innerHTML=[['trim','Trim'],['speed','Speed'],['vol','Volume'],['fil','Filter'],['text','Text'],['cvs','Canvas']].map(([k,l])=>`<button data-k="${k}" class="${tab==k?'on':''}">${l}</button>`).join('');renderTL()}
const FM={};
const rg=(id,l,min,max,st,val,f)=>{FM[id]=f;return`<label class="rw"><span>${l}</span><input type="range" id="${id}" min="${min}" max="${max}" step="${st}" value="${val}"><output id="o_${id}">${f?f(val):val}</output></label>`};
const s2=x=>(+x).toFixed(2)+'s';
function panel(){const P=$('#pn'),c=clips[sel];let h='';
if(tab=='cvs'){h=`<div class="chips">${Object.keys(R).map(k=>`<button data-r="${k}" class="${ratio==k?'on':''}">${k}</button>`).join('')}</div><div class="chips"><button data-fit="fit" class="${fit=='fit'?'on':''}">Fit</button><button data-fit="fill" class="${fit=='fill'?'on':''}">Fill</button></div>`}
else if(!c&&tab!='text')h='<p class="mu">Add a video to unlock these tools.</p>';
else if(tab=='trim')h=rg('in','Start',0,c.dur,.05,c.in,s2)+rg('out','End',0,c.dur,.05,c.out,s2)+`<p class="mu">Selected clip: ${c.name}</p>`;
else if(tab=='speed')h=rg('sp','Speed',.25,4,.05,c.sp,x=>(+x).toFixed(2)+'x');
else if(tab=='vol')h=rg('vo','Volume',0,2,.05,c.vol,x=>Math.round(x*100)+'%');
else if(tab=='fil')h=`<div class="chips">${Object.keys(PRE).map(k=>`<button data-p="${k}">${k}</button>`).join('')}</div>`+rg('fb','Bright',50,150,1,c.f.b)+rg('fc','Contrast',50,150,1,c.f.c)+rg('fs','Saturate',0,200,1,c.f.s);
else if(tab=='text'){const x=texts[selT];h=`<div class="chips"><button class="ac" id="at">Add text</button></div>`;if(x)h+=`<div class="rw"><input type="text" id="tt" value="${x.txt.replace(/"/g,'&quot;')}"><input type="color" id="tc" value="${x.c}"></div>`+rg('tz','Size',20,140,1,x.z)+rg('ts','Start',0,Math.max(total(),1),.1,x.s,s2)+rg('te','End',0,Math.max(total(),1),.1,x.e,s2);else h+='<p class="mu">Tap Add text, then drag it on the preview.</p>'}
P.innerHTML=h}
$('#pn').addEventListener('pointerdown',e=>{if(e.target.type=='range'||e.target.type=='color')snap()});
$('#pn').addEventListener('input',e=>{const id=e.target.id,val=e.target.value,c=clips[sel],x=texts[selT];
if(id=='in'){c.in=Math.min(+val,c.out-.2);e.target.value=c.in;seek(off(sel))}
else if(id=='out'){c.out=Math.max(+val,c.in+.2);e.target.value=c.out;seek(off(sel)+len(c)-.05)}
else if(id=='sp'){c.sp=+val;v.playbackRate=c.sp}
else if(id=='vo'){c.vol=+val;if(gain)gain.gain.value=c.vol}
else if(id=='fb')c.f.b=+val;else if(id=='fc')c.f.c=+val;else if(id=='fs')c.f.s=+val;
else if(id=='tt'){x.txt=val||' '}else if(id=='tc')x.c=val;else if(id=='tz')x.z=+val;
else if(id=='ts'){x.s=Math.min(+val,x.e-.2)}else if(id=='te'){x.e=Math.max(+val,x.s+.2)}
const o=$('#o_'+id);if(o)o.textContent=FM[id]?FM[id](e.target.value):e.target.value;renderTL();if(id=='sp'||id=='in'||id=='out')head()});
$('#pn').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.r){ratio=b.dataset.r;panel()}else if(b.dataset.fit){fit=b.dataset.fit;panel()}
else if(b.dataset.p){snap();const p=PRE[b.dataset.p];clips[sel].f={b:p[0],c:p[1],s:p[2],x:p[3]};panel()}
else if(b.id=='at'){snap();texts.push({txt:'Your text',x:.5,y:.5,z:56,c:'#ffffff',s:t,e:t+3});selT=texts.length-1;panel();renderTL()}});
function snap(){hist.push(JSON.stringify({clips,texts}));if(hist.length>60)hist.shift()}
function chg(){if(sel>=clips.length)sel=clips.length-1;if(sel<0)sel=0;ui();panel();seek(t)}
$('#un').onclick=()=>{if(!hist.length)return toast('Nothing to undo');const s=JSON.parse(hist.pop());clips=s.clips;texts=s.texts;selT=-1;chg()};
$('#pl').onclick=()=>playing?pause():play();
$('#zi').onclick=()=>{PPS=Math.min(200,PPS*1.4);renderTL()};$('#zo').onclick=()=>{PPS=Math.max(12,PPS/1.4);renderTL()};
$('#ad').onclick=$('#ad0').onclick=()=>$('#fi').click();
$('#fi').onchange=async e=>{snap();for(const f of e.target.files){const url=URL.createObjectURL(f);const d=await new Promise(r=>{const x=document.createElement('video');x.preload='metadata';x.onloadedmetadata=()=>r(x.duration);x.onerror=()=>r(0);x.src=url});
if(!d||!isFinite(d)){toast('Couldn’t read '+f.name);continue}clips.push({url,name:f.name.replace(/\.[^.]+$/,''),dur:d,in:0,out:d,sp:1,vol:1,f:{b:100,c:100,s:100,x:''}})}
e.target.value='';sel=clips.length-1;chg()};
$('#sp').onclick=()=>{if(!clips.length)return;const p=at(t),c=clips[p.i],s=c.in+p.l*c.sp;if(s<=c.in+.1||s>=c.out-.1)return toast('Move the playhead inside a clip to split');snap();clips.splice(p.i,1,{...c,out:s},{...c,in:s,f:{...c.f}});sel=p.i+1;chg()};
$('#du').onclick=()=>{if(tab=='text'&&selT>=0){snap();const x={...texts[selT]};x.s+=.5;x.e+=.5;texts.push(x);selT=texts.length-1}else if(clips.length){snap();clips.splice(sel+1,0,{...clips[sel],f:{...clips[sel].f}});sel++}chg()};
$('#de').onclick=()=>{if(tab=='text'&&selT>=0){snap();texts.splice(selT,1);selT=-1}else if(clips.length){snap();clips.splice(sel,1)}chg()};
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(b){tab=b.dataset.k;ui();panel()}};
$('#cr').onclick=e=>{const b=e.target.closest('.cl');if(b){sel=+b.dataset.i;if(tab=='text')tab='trim';ui();panel()}};
$('#xr').onclick=e=>{const b=e.target.closest('.tx');if(b){selT=+b.dataset.i;tab='text';ui();panel()}};
const scrub=e=>{if(e.buttons||e.type=='pointerdown'){const r=$('#in').getBoundingClientRect();seek((e.clientX-r.left-PAD)/PPS)}};
$('#rl').onpointerdown=e=>{e.target.setPointerCapture&&$('#rl').setPointerCapture(e.pointerId);pause();scrub(e)};$('#rl').onpointermove=scrub;
function cpos(e){const r=cv.getBoundingClientRect(),[W,H]=R[ratio],s=Math.min(r.width/W,r.height/H),dw=W*s,dh=H*s;return[(e.clientX-r.left-(r.width-dw)/2)/dw,(e.clientY-r.top-(r.height-dh)/2)/dh]}
cv.onpointerdown=e=>{const[px,py]=cpos(e);let b=-1,bd=.2;texts.forEach((x,i)=>{if(t<x.s||t>x.e)return;const d=Math.hypot(x.x-px,(x.y-py)*.6);if(d<bd){bd=d;b=i}});
if(b>=0){selT=b;drag=1;snap();cv.setPointerCapture(e.pointerId);tab='text';ui();panel()}};
cv.onpointermove=e=>{if(!drag)return;const[px,py]=cpos(e),x=texts[selT];x.x=Math.min(1,Math.max(0,px));x.y=Math.min(1,Math.max(0,py))};
cv.onpointerup=()=>drag=0;
async function exp(){if(!clips.length)return toast('Add a video first');if(!window.MediaRecorder)return toast('Export isn’t supported in this browser');
pause();audio();await ac.resume();selT=-1;const st=cv.captureStream(30);dest.stream.getAudioTracks().forEach(k=>st.addTrack(k));
const m=['video/mp4;codecs=avc1,mp4a.40.2','video/webm;codecs=vp9,opus','video/webm'].find(x=>MediaRecorder.isTypeSupported(x))||'',ch=[];
rec=new MediaRecorder(st,m?{mimeType:m,videoBitsPerSecond:8e6}:{});rec.ondataavailable=e=>e.data.size&&ch.push(e.data);
rec.onstop=()=>{const ty=rec.mimeType||'video/webm';result(new Blob(ch,{type:ty}),ty.includes('mp4')?'mp4':'webm')};
$('#mo').hidden=false;$('#mb').innerHTML='<div style="font-size:16px;font-weight:700">Exporting <span id="pc">0%</span></div><p class="mu">Keep this screen open. Export runs in real time.</p>';
seek(0);setTimeout(()=>{rec.start(200);exporting=true;play()},400)}
function fin(){exporting=false;setTimeout(()=>rec.state!='inactive'&&rec.stop(),300)}
function result(b,ext){const u=URL.createObjectURL(b);$('#mb').innerHTML=`<video src="${u}" controls playsinline></video><div class="row"><button class="ac" id="sv">Save or share</button><button id="cl">Close</button></div><p class="mu">Format: .${ext}. If saving is blocked, press and hold the video to download it.</p>`;
$('#cl').onclick=()=>$('#mo').hidden=true;
$('#sv').onclick=async()=>{const f=new File([b],'editor-export.'+ext,{type:b.type});try{if(await saveNative(b,f.name))return;if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f]});else{const a=document.createElement('a');a.href=u;a.download=f.name;a.click()}}catch(_){}}}
$('#ex').onclick=exp;
ui();panel();tick();if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
